<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五上國語短語樂園 - 讀寫障礙互動輔具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      letter-spacing: 0.08em;
      line-height: 1.8;
      background-color: #fefce8; /* 柔和米黃背景 */
    }
    /* 詞性色彩視覺化鷹架 */
    .color-noun { background-color: #dbeafe; border-color: #3b82f6; color: #1e40af; } /* 名詞: 藍色 */
    .color-verb { background-color: #fce7f3; border-color: #ec4899; color: #9d174d; } /* 動詞: 粉紅色 */
    .color-adj  { background-color: #dcfce7; border-color: #22c55e; color: #14532d; } /* 形容詞: 綠色 */
    .color-meas { background-color: #fef3c7; border-color: #f59e0b; color: #78350f; } /* 量詞: 黃色 */

    .slot-box {
      min-width: 105px;
      min-height: 56px;
      border-style: dashed;
      transition: all 0.2s ease;
    }
    .card-btn {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .pulsing-mic {
      animation: pulse-red 1.5s infinite;
    }
    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body class="min-h-screen p-3 md:p-6 flex flex-col items-center justify-between">

  <!-- 頂部導覽：課次選擇與積分 -->
  <header class="w-full max-w-4xl bg-white rounded-2xl p-4 shadow-md flex flex-col sm:flex-row justify-between items-center gap-3 mb-4">
    <div class="flex items-center space-x-3">
      <span class="text-3xl">🌟</span>
      <div>
        <h1 class="text-lg md:text-xl font-black text-amber-800">國語五上短語學習樂園</h1>
        <p class="text-xs text-gray-500">多感官生活化造句輔具</p>
      </div>
    </div>

    <!-- 課次選擇下拉選單 -->
    <div class="flex items-center gap-3 w-full sm:w-auto">
      <select id="lessonSelect" onchange="onLessonChange()" class="bg-amber-100 border-2 border-amber-300 text-amber-900 font-bold rounded-xl px-3 py-1.5 text-sm outline-none cursor-pointer">
        <!-- 課次列表動態載入 -->
      </select>
      <div class="bg-amber-50 px-3 py-1.5 rounded-xl border border-amber-200 text-amber-900 font-bold text-sm whitespace-nowrap">
        🏆 得分：<span id="scoreText" class="text-amber-600 text-base">0</span>
      </div>
    </div>
  </header>

  <!-- 主要練習卡片區 -->
  <main class="w-full max-w-4xl bg-white rounded-3xl p-5 md:p-8 shadow-xl border-4 border-amber-200 relative">
    
    <!-- 1. 生活例圖與口述導引卡 -->
    <div class="bg-amber-50/80 rounded-2xl p-4 mb-5 border border-amber-200 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
      <div class="flex items-start space-x-3">
        <div id="topicIcon" class="text-4xl md:text-5xl bg-white p-3 rounded-2xl shadow-sm shrink-0">🖼️</div>
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span id="unitTag" class="bg-amber-200 text-amber-900 text-xs font-bold px-2 py-0.5 rounded-full">單元一</span>
            <span id="lessonTag" class="bg-amber-300 text-amber-950 text-xs font-bold px-2 py-0.5 rounded-full">第一課</span>
          </div>
          <p id="imageDescription" class="text-xs md:text-sm text-amber-900 font-medium mb-1">🖼 【例圖】一位小朋友坐在沙發上，閉著眼睛聽音樂，臉上帶著放鬆的笑容。</p>
          <h2 id="promptQuestion" class="text-base md:text-lg font-black text-amber-950">🗣️ 聽音樂可以讓人怎麼樣呢？試著說說看！</h2>
        </div>
      </div>
      <button onclick="playTTS(currentQuestion.promptQuestion)" class="self-end md:self-center bg-amber-500 hover:bg-amber-600 text-white font-bold px-3.5 py-2 rounded-xl text-xs md:text-sm shadow transition flex items-center gap-1 shrink-0">
        <span>🔊</span> 聽口述引導
      </button>
    </div>

    <!-- 2. 步驟一：課本範例與報讀 -->
    <section class="mb-6 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
      <div class="flex justify-between items-center mb-1">
        <span class="text-xs font-bold text-slate-500">【步驟 1】觀察課本例句結構</span>
        <button onclick="playTTS(currentQuestion.exampleSentence)" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 px-2.5 py-1 rounded-lg font-bold">
          <span>🔊</span> 朗讀課本例句
        </button>
      </div>
      <div id="exampleDisplay" class="text-base md:text-xl font-black text-slate-700 text-center py-1">
        <!-- 課本範例 -->
      </div>
    </section>

    <!-- 3. 步驟二：詞卡排排看 -->
    <section class="mb-6">
      <div class="flex justify-between items-center mb-2 flex-wrap gap-2">
        <span class="text-xs font-bold text-amber-800">【步驟 2】將適當的詞卡放入格子中</span>
        
        <!-- 操作按鈕區 -->
        <div class="flex items-center gap-2">
          <button onclick="playCurrentSentenceTTS()" class="text-xs bg-amber-500 hover:bg-amber-600 text-white px-3 py-1 rounded-lg font-bold flex items-center gap-1 shadow-sm transition">
            <span>🔊</span> 再播放一次組合
          </button>
          <button onclick="resetSlots()" class="text-xs text-amber-600 hover:underline font-bold px-1 py-1">
            重置答案
          </button>
        </div>
      </div>

      <!-- 放置槽區 -->
      <div id="slotContainer" class="flex flex-wrap items-center justify-center gap-2 p-3 bg-amber-50/50 rounded-2xl min-h-[80px]">
        <!-- 動態產生結構槽 -->
      </div>

      <!-- 備選詞卡區 -->
      <div id="wordBank" class="mt-4 flex flex-wrap justify-center gap-2.5 p-3.5 bg-white rounded-2xl border-2 border-dashed border-amber-300">
        <!-- 動態產生備選詞卡 -->
      </div>
    </section>

    <!-- 4. 步驟三：口語造句與語音校正 -->
    <section class="bg-gradient-to-r from-blue-50 to-indigo-50 p-4 rounded-2xl border border-blue-200">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-bold text-blue-800">【步驟 3】不用寫字，用講的大聲造句</span>
        <span class="text-xs text-blue-500">即時語音辨識與評估</span>
      </div>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-3 py-1">
        <button id="micBtn" onclick="toggleRecording()" class="flex items-center gap-2 bg-rose-500 hover:bg-rose-600 text-white text-base font-bold px-5 py-2.5 rounded-xl shadow transition transform active:scale-95">
          <span id="micIcon" class="text-xl">🎙️</span>
          <span id="micText">按下開始錄音造句</span>
        </button>

        <button id="playRecordBtn" onclick="playUserAudio()" disabled class="flex items-center gap-1.5 bg-gray-300 text-gray-600 text-sm font-bold px-4 py-2.5 rounded-xl shadow transition cursor-not-allowed">
          <span>▶️</span> 聽聽看自己的錄音
        </button>
      </div>

      <!-- 語音辨識輸出 -->
      <div class="mt-3 bg-white rounded-xl p-2.5 border border-blue-100 text-center min-h-[45px] flex items-center justify-center">
        <p id="sttResult" class="text-gray-400 italic text-xs md:text-sm">點擊上方麥克風，用講的把您組合的短語唸出來...</p>
      </div>

      <!-- 語音校正回饋 -->
      <div id="feedbackBox" class="hidden mt-2 p-2.5 rounded-xl text-center font-bold text-xs md:text-sm"></div>
    </section>

  </main>

  <!-- 底部分頁導覽 -->
  <footer class="w-full max-w-4xl flex justify-between items-center mt-4">
    <button onclick="prevQuestion()" class="bg-white hover:bg-gray-100 text-gray-700 font-bold px-4 py-2 rounded-xl shadow border border-gray-200 text-sm transition">
      ⬅️ 上一題
    </button>
    <span id="pageIndicator" class="font-bold text-amber-900 text-xs md:text-sm">第 1 / 18 題</span>
    <button onclick="nextQuestion()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-5 py-2 rounded-xl shadow text-sm transition">
      下一題 ➡️
    </button>
  </footer>

  <!-- 全 18 題庫資料與系統邏輯 -->
  <script>

    let currentIndex = 0;
    let score = 0;
    let currentQuestion = questions[0];
    let userAnswers = {};
    let isRecording = false;
    let recognition = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let recordedAudioUrl = null;
    let mediaStream = null;

    const posClassMap = { noun: "color-noun", verb: "color-verb", adj: "color-adj", meas: "color-meas" };
    const posNameMap = { noun: "名詞", verb: "動詞", adj: "形容詞", meas: "量詞" };

    window.onload = () => {
      initLessonDropdown();
      loadQuestion(0);
      setupSpeechRecognition();
    };

    function initLessonDropdown() {
      const select = document.getElementById('lessonSelect');
      select.innerHTML = '';
      
      const lessons = [...new Set(questions.map(q => q.lesson))];
      lessons.forEach(l => {
        const opt = document.createElement('option');
        opt.value = l;
        opt.innerText = l;
        select.appendChild(opt);
      });
    }

    function onLessonChange() {
      const selectedLesson = document.getElementById('lessonSelect').value;
      const targetIndex = questions.findIndex(q => q.lesson === selectedLesson);
      if (targetIndex !== -1) {
        loadQuestion(targetIndex);
      }
    }

    function loadQuestion(index) {
      if (isRecording) stopRecording();

      currentIndex = index;
      currentQuestion = questions[index];
      userAnswers = {};
      recordedAudioUrl = null;

      document.getElementById('lessonSelect').value = currentQuestion.lesson;

      // 重置播放按鈕與狀態
      const playBtn = document.getElementById('playRecordBtn');
      playBtn.disabled = true;
      playBtn.className = "flex items-center gap-1.5 bg-gray-300 text-gray-600 text-sm font-bold px-4 py-2.5 rounded-xl shadow cursor-not-allowed";
      document.getElementById('sttResult').innerHTML = '<p class="text-gray-400 italic text-xs md:text-sm">點擊上方麥克風，用講的把您組合的短語唸出來...</p>';
      
      // 清除回饋訊息
      const feedbackBox = document.getElementById('feedbackBox');
      feedbackBox.classList.add('hidden');
      feedbackBox.innerText = '';

      document.getElementById('topicIcon').innerText = currentQuestion.icon;
      document.getElementById('unitTag').innerText = currentQuestion.unit;
      document.getElementById('lessonTag').innerText = currentQuestion.lesson;
      document.getElementById('imageDescription').innerText = currentQuestion.imageDesc;
      document.getElementById('promptQuestion').innerText = currentQuestion.promptQuestion;
      document.getElementById('exampleDisplay').innerText = currentQuestion.exampleSentence;
      document.getElementById('pageIndicator').innerText = `第 ${currentIndex + 1} / ${questions.length} 題`;

      renderSlots();
      renderWordBank();
    }

    function renderSlots() {
      const container = document.getElementById('slotContainer');
      container.innerHTML = '';

      currentQuestion.template.forEach((item, slotIdx) => {
        if (item.type === 'text') {
          const span = document.createElement('span');
          span.className = 'text-lg md:text-2xl font-black text-slate-700 mx-0.5';
          span.innerText = item.val;
          container.appendChild(span);
        } else {
          const slot = document.createElement('div');
          const posClass = posClassMap[item.pos] || 'bg-white';
          const filledWord = userAnswers[slotIdx];

          slot.className = `slot-box rounded-2xl border-2 flex flex-col items-center justify-center p-1.5 cursor-pointer ${posClass}`;
          
          if (filledWord) {
            slot.innerHTML = `
              <span class="text-base md:text-lg font-black">${filledWord}</span>
              <span class="text-[10px] opacity-75">（點擊退回）</span>
            `;
            slot.onclick = () => removeWordFromSlot(slotIdx);
          } else {
            slot.innerHTML = `
              <span class="text-xs font-bold opacity-60">【${item.role}】</span>
              <span class="text-[10px] text-gray-500">（${posNameMap[item.pos]}）</span>
            `;
          }
          container.appendChild(slot);
        }
      });
    }

    function renderWordBank() {
      const bank = document.getElementById('wordBank');
      bank.innerHTML = '';
      const usedWords = Object.values(userAnswers);

      currentQuestion.words.forEach((w) => {
        const isUsed = usedWords.includes(w.text);
        const btn = document.createElement('button');
        const posClass = posClassMap[w.pos] || 'bg-gray-100';

        btn.className = `card-btn px-3.5 py-2 rounded-xl border-2 font-black text-base shadow-sm ${posClass} ${isUsed ? 'opacity-30 cursor-not-allowed' : ''}`;
        btn.innerText = w.text;
        
        if (!isUsed) {
          btn.onclick = () => assignWordToFirstAvailableSlot(w.text);
        } else {
          btn.disabled = true;
        }

        bank.appendChild(btn);
      });
    }

    function assignWordToFirstAvailableSlot(wordText) {
      const slots = currentQuestion.template;
      for (let i = 0; i < slots.length; i++) {
        if (slots[i].type === 'slot' && !userAnswers[i]) {
          userAnswers[i] = wordText;
          playTTS(wordText); // 點擊卡片發出讀音
          break;
        }
      }
      renderSlots();
      renderWordBank();
      checkCompletion();
    }

    function removeWordFromSlot(slotIdx) {
      delete userAnswers[slotIdx];
      
      // 移除時同時隱藏過期的回饋訊息
      const feedbackBox = document.getElementById('feedbackBox');
      feedbackBox.classList.add('hidden');

      renderSlots();
      renderWordBank();
    }

    // 修正1：重置答案時同步隱藏並清空回饋框
    function resetSlots() {
      userAnswers = {};
      
      const feedbackBox = document.getElementById('feedbackBox');
      feedbackBox.classList.add('hidden');
      feedbackBox.innerText = '';

      renderSlots();
      renderWordBank();
    }

    // 播放目前組合短語
    function playCurrentSentenceTTS() {
      const currentText = currentQuestion.template.map((item, idx) => {
        if (item.type === 'text') return item.val;
        return userAnswers[idx] ? userAnswers[idx] : '';
      }).join('');

      if (Object.keys(userAnswers).length === 0) {
        playTTS("請先點選下方詞卡放到格子裡，再播放聽聽看喔！");
      } else {
        playTTS(currentText);
      }
    }

    function checkCompletion() {
      const slotIndices = currentQuestion.template
        .map((item, idx) => item.type === 'slot' ? idx : null)
        .filter(idx => idx !== null);

      const allFilled = slotIndices.every(idx => userAnswers[idx]);

      if (allFilled) {
        let isCorrect = true;
        slotIndices.forEach(idx => {
          if (userAnswers[idx] !== currentQuestion.template[idx].correct) {
            isCorrect = false;
          }
        });

        if (isCorrect) {
          score += 10;
          document.getElementById('scoreText').innerText = score;
          const fullSentence = buildCurrentSentence();
          showFeedback(true, `🎉 排對了！「${fullSentence}」，現在點選錄音鍵大聲說出來吧！`);
          playTTS(`太棒了！組合成功：${fullSentence}`);
        } else {
          showFeedback(false, "💡 詞性很對，但意思可以再調整一下，讓句子更通順喔！");
        }
      }
    }

    function buildCurrentSentence() {
      return currentQuestion.template.map((item, idx) => {
        return item.type === 'text' ? item.val : (userAnswers[idx] || '___');
      }).join('');
    }

    function playTTS(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-TW';
        utter.rate = 0.85; // 語速稍微放慢適合學習者
        window.speechSynthesis.speak(utter);
      }
    }

    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-TW';
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onresult = (event) => {
          const transcript = Array.from(event.results)
            .map(result => result[0].transcript)
            .join('');
          document.getElementById('sttResult').innerHTML = `<span class="text-blue-900 font-bold text-base">「${transcript}」</span>`;
          
          if (event.results[0].isFinal) {
            evaluateSpeech(transcript);
          }
        };

        recognition.onend = () => {
          if (isRecording) {
            stopRecording();
          }
        };
      }
    }

    // 修正2：錄音與音訊播放邏輯優化
    async function toggleRecording() {
      if (!isRecording) {
        await startRecording();
      } else {
        stopRecording();
      }
    }

    async function startRecording() {
      isRecording = true;
      document.getElementById('micBtn').classList.add('pulsing-mic', 'bg-red-600');
      document.getElementById('micText').innerText = "聆聽中，請大聲說話...";

      const playBtn = document.getElementById('playRecordBtn');
      playBtn.disabled = true;
      playBtn.className = "flex items-center gap-1.5 bg-gray-300 text-gray-600 text-sm font-bold px-4 py-2.5 rounded-xl shadow cursor-not-allowed";

      // 啟動錄音器
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
        mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          recordedAudioUrl = URL.createObjectURL(audioBlob);

          // 啟用播放按鈕
          playBtn.disabled = false;
          playBtn.className = "flex items-center gap-1.5 bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-bold px-4 py-2.5 rounded-xl shadow cursor-pointer";
          
          // 釋放麥克風資源
          if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
          }
        };

        mediaRecorder.start();
      } catch (e) {
        console.error("無法開啟麥克風：", e);
        alert("無法開啟麥克風，請確認是否授權瀏覽器存取麥克風權限！");
        stopRecording();
        return;
      }

      // 啟動語音辨識
      if (recognition) {
        try {
          recognition.start();
        } catch (err) {
          console.log("語音辨識已啟動中：", err);
        }
      }
    }

    function stopRecording() {
      isRecording = false;
      document.getElementById('micBtn').classList.remove('pulsing-mic', 'bg-red-600');
      document.getElementById('micText').innerText = "按下開始錄音造句";

      if (recognition) {
        try { recognition.stop(); } catch(e){}
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    function playUserAudio() {
      if (recordedAudioUrl) {
        const audio = new Audio(recordedAudioUrl);
        audio.play().catch(err => console.error("播放音訊失敗：", err));
      }
    }

    function evaluateSpeech(userSpokenText) {
      const target = currentQuestion.targetPhrase;
      const keyWords = currentQuestion.template
        .filter(t => t.type === 'slot')
        .map(t => t.correct);

      let matchedCount = 0;
      keyWords.forEach(kw => {
        if (userSpokenText.includes(kw)) matchedCount++;
      });

      if (userSpokenText.includes(target) || matchedCount === keyWords.length) {
        showFeedback(true, `🌟 發音太清楚了！完整的說出了：「${userSpokenText}」！`);
        playTTS("好棒的發音！你說得非常清楚！");
      } else if (matchedCount > 0) {
        showFeedback(false, `聽到了『${userSpokenText}』，已經說對一大半囉！再大聲試一次！`);
      } else {
        showFeedback(false, `別擔心，對著上方的詞卡再大聲唸一次看看喔！`);
      }
    }

    function showFeedback(isSuccess, message) {
      const box = document.getElementById('feedbackBox');
      box.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-amber-100', 'text-amber-800');
      box.classList.add(isSuccess ? 'bg-green-100' : 'bg-amber-100', isSuccess ? 'text-green-800' : 'text-amber-800');
      box.innerText = message;
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) {
        loadQuestion(currentIndex + 1);
      } else {
        alert("🎉 恭喜你完成了五上第一、二單元所有的短語練習！太優秀了！");
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        loadQuestion(currentIndex - 1);
      }
    }
  </script>
</body>
</html>
